name: iClone adapter offline tests

on:
  push:
    branches: [iClone]
  pull_request:
    branches: [iClone]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q iclone_adapter tests
      - run: python -m unittest discover -s tests -p 'test_iclone_*.py' -v
