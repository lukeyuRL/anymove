name: iClone adapter offline tests

on:
  push:
    branches: [iClone, iClone_High_Res]
  pull_request:
    branches: [iClone, iClone_High_Res]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q mocap blender tools iclone_adapter tests
      - run: python -m unittest discover -s tests -p 'test_iclone_*.py' -v

  visibility-numpy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -p 'test_iclone_visibility.py' -v
      - run: python -m unittest discover -s tests -p 'test_iclone_temporal_association.py' -v
